name: Deploy playground to GitHub Pages

# Publishes playground/ (the local, no-chain frontend) as the whole site.
# The previous on-chain frontend workflow (staging + tagged releases) is kept
# at .github/disabled/deploy-onchain.yml.

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'solver/c/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile downloads a pinned, SHA-256-verified Zig into solver/c/zig/.
      # Cache it; a version bump in the Makefile changes the key and re-downloads.
      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: solver/c/zig
          key: zig-${{ runner.os }}-${{ hashFiles('solver/c/Makefile') }}
          restore-keys: zig-${{ runner.os }}-

      # pnpm version comes from "packageManager" in playground/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: playground/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playground/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: playground
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: playground
        run: pnpm test

      # Builds solver/c/truchet_svg.wasm (via Zig), copies it to public/, then
      # type-checks and runs vite: dist/index.html + dist/truchet_svg.wasm.
      - name: Build
        working-directory: playground
        run: pnpm build

      - name: Check build output
        run: |
          test -s playground/dist/index.html
          test -s playground/dist/truchet_svg.wasm
          ls -la playground/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
